sources:
  rss:
    type: rss
    feeds:
      - https://www.freebuf.com/feed
      - https://api.anquanke.com/data/v1/rss
      - https://xz.aliyun.com/feed
      - https://www.4hou.com/feed
      - https://kitploit.com/feeds/posts/default
      - https://hnrss.org/newest?q=security
      - https://www.oschina.net/news/rss?show=sec
      - https://unit42.paloaltonetworks.com/feed/
      - https://research.checkpoint.com/feed/
  github:
    type: github
    search_queries:
      - "topic:security stars:>1000"
      - "topic:pentest stars:>500"
    awesome_repos:
      - sbilly/awesome-security
      - enaqx/awesome-pentest
      - qazbnm456/awesome-web-security
  nvd:
    type: nvd
    days_back: 7
    max_pages: 20
  kev:
    type: kev
  exploitdb:
    type: exploitdb
    max_rows: 500
  vulhub:
    type: vulhub
  github_docs:
    type: github_docs
    repos:
      - repo: swisskyrepo/PayloadsAllTheThings
        max_files: 200
      - repo: HackTricks-wiki/hacktricks
        include_prefixes: ["src/"]
        exclude_prefixes: ["src/todo/"]
        max_files: 700
      - repo: swisskyrepo/InternalAllTheThings
        include_prefixes: ["docs/"]
        max_files: 200
      - repo: GTFOBins/GTFOBins.github.io
        include_prefixes: ["_gtfobins/"]
        suffixes: [""]
        title_prefix: GTFOBins
        max_files: 500
      - repo: Threekiii/Awesome-POC
        max_files: 800
      - repo: ffffffff0x/1earn
        include_prefixes: ["1earn/"]
        max_files: 400
      - repo: Bypass007/Emergency-Response-Notes
        max_files: 100
  github_docs_audit:
    type: github_docs
    file_delay: 0.2
    repos:
      # Java 代码审计中文笔记（service 毕设方向）
      - repo: cn-panda/JavaCodeAudit
        max_files: 60
      - repo: lokerxx/JavaVul
        max_files: 60
      - repo: proudwind/javasec_study
        max_files: 20
      - repo: 7hang/--Java
        max_files: 15
      - repo: j3ers3/Hello-Java-Sec
        max_files: 15
      # Spring / Spring Boot 漏洞利用与审计
      - repo: LandGrey/SpringBootVulExploit
        max_files: 15
      - repo: JoyChou93/java-sec-code
        max_files: 15
      # 代码审计方法论与工具链
      - repo: webraybtl/CodeQLpy
        max_files: 20
  github_docs_codeql:
    type: github_docs
    file_delay: 0.15
    repos:
      # CodeQL 官方 Java 查询库：每个 query 配一篇 .md，讲漏洞类型与检测思路
      - repo: github/codeql
        include_prefixes: ["java/"]
        suffixes: [".md"]
        max_files: 500
  github_docs_semgrep:
    type: github_docs
    file_delay: 0.15
    repos:
      # Semgrep 官方 Java 规则（yaml 按纯文本入库，保留 rule id 与描述）
      - repo: semgrep/semgrep-rules
        include_prefixes: ["java/"]
        suffixes: [".yaml", ".yml"]
        max_files: 150
  github_docs_zh:
    type: github_docs
    file_delay: 0.2
    repos:
      - repo: Threekiii/Vulnerability-Wiki
        max_files: 900
      - repo: ctf-wiki/ctf-wiki
        include_prefixes: ["docs/"]
        max_files: 600
      - repo: Ascotbe/Kernelhub
        max_files: 250
  github_docs_std:
    type: github_docs
    file_delay: 0.2
    repos:
      - repo: OWASP/wstg
        max_files: 200
      - repo: OWASP/CheatSheetSeries
        include_prefixes: ["cheatsheets/"]
        max_files: 200
      # yaklang/hack-skills（2026-09-27 并入）：面向 Agent 的攻击技能库
      # （103 深度技能 + 主/分类入口），skills/*/SKILL.md 为主，深度原文
      # （如 JAVA_GADGET_CHAINS.md）一并收录供 kb_get 切片深读
      - repo: yaklang/hack-skills
        max_files: 400
      # ljagiello/ctf-skills（2026-09-27 并入）：Agent Skills 规范的 CTF 技能库
      # （10 个 ctf-* 分类：web/pwn/crypto/reverse/forensics/osint/ai-ml/
      #  malware/misc/writeup + solve-challenge 总路由）。技能目录在仓库根下，
      # 每个 SKILL.md ≤500 行，参考文档（pat-reference/unicorn-emulation/
      # post-quantum 等）一并收录。补齐 hack-skills 缺失的 crypto/pwn/
      # reverse/forensics 四类
      - repo: ljagiello/ctf-skills
        include_prefixes: ["ctf-", "solve-challenge/"]
        exclude_prefixes: ["ctf-web/payloads/"]
        max_files: 300

# DeepSeek 计费峰谷策略（北京时间）
# 官方定义（UTC）：峰时 周一至周五 01:00-04:00、06:00-10:00，其余为谷时
# 换算北京：峰时 工作日 09:00-12:00、14:00-18:00；周末与中国法定节假日全天谷时
# 富化（enrich）是唯一消耗模型额度的任务，峰时直接跳过；采集/向量化/索引为本地开销，不受此限
offpeak:
  enabled: true
  timezone: Asia/Shanghai
  peak_windows:
    - "09:00-12:00"
    - "14:00-18:00"
  # 法定节假日按谷时处理，格式 YYYY-MM-DD
  holidays: []

collect:
  # RSS 原本 0 */6，12:00 与 18:00 落在峰时边界，整体平移到 1/7/13/19
  rss: "0 1,7,13,19 * * *"
  nvd: "0 3 * * *"
  kev: "30 3 * * *"
  github: "0 4 * * 1"
  exploitdb: "0 5 * * *"
  vulhub: "0 5 * * 0"
  github_docs: "0 6 * * 1"
  github_docs_zh: "0 7 * * 1"
  github_docs_std: "30 7 * * 1"
enrich:
  every_minutes: 10
embed:
  every_minutes: 30
index:
  every_minutes: 30

[project]
name = "seckb"
version = "0.1.0"
description = "面向 AI agent 的本地网络安全知识库"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13",
    "pymupdf4llm>=0.0.17",
    "ebooklib>=0.18",
    "rich>=13.7",
    "httpx>=0.27",
    "feedparser>=6.0",
    "apscheduler>=3.10",
    "lancedb>=0.15",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
seckb = "seckb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seckb*"]

[tool.setuptools.package-data]
seckb = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
